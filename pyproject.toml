[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sais-score"
version = "0.1.0"
description = "Semantic Anchor & Intent Score, a fact-aware text evaluation metric."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-SAIS-Commercial" }
authors = [{ name = "Bharath Raghavan" }]
keywords = ["evaluation", "llm", "nlp", "metrics", "hallucination"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
ner = ["spacy>=3.7"]
benchmarks = [
  "bert-score>=0.3.13",
  "datasets>=2.19",
  "rouge-score>=0.1.2",
  "sacrebleu>=2.4",
  "scipy>=1.11",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
all = [
  "sentence-transformers>=3.0",
  "spacy>=3.7",
  "bert-score>=0.3.13",
  "datasets>=2.19",
  "rouge-score>=0.1.2",
  "sacrebleu>=2.4",
  "scipy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
sais-score = "sais_score.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sais_score"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
